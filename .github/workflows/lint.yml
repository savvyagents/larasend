name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Generate Wayfinder Types
        run: |
          php artisan package:discover --ansi
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Check Pint
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check

      - name: Check TypeScript
        run: npm run types:check

      - name: Audit PHP Dependencies
        run: composer audit --locked --no-interaction

      # Dev dependencies are excluded because GHSA-vfj7-8cjw-p6xm (braces,
      # reached only through @vue/eslint-config-typescript's lint tooling)
      # affects every published version with no patched release, and the only
      # automated remediation downgrades the eslint config below the API this
      # repo uses. Re-tighten once a fixed braces release exists.
      - name: Audit Node Dependencies
        run: npm audit --omit=dev --audit-level=high
